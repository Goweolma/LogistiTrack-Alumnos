name: Tests

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Prepare the demonstration environment
        run: cp .env.example .env

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Start the platform
        run: docker compose up -d --build

      - name: Wait until the platform is healthy
        run: |
          for attempt in $(seq 1 36); do
            if python scripts/health_platform.py; then
              exit 0
            fi
            sleep 10
          done
          docker compose ps -a
          docker compose logs --tail 100
          exit 1
