name: logistitrack-alumnos

x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:?Configura DATABASE_URL en .env usando .env.example}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
  PYTHONUNBUFFERED: "1"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logistitrack}
      POSTGRES_USER: ${POSTGRES_USER:-logisti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env usando .env.example}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logisti} -d ${POSTGRES_DB:-logistitrack}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [logistitrack]

  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 8s
      timeout: 8s
      retries: 20
      start_period: 20s
    networks: [logistitrack]

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        set -e;
        for topic in orders inventory warehouse deliveries order-status dead-letter; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$topic --partitions 3 --replication-factor 1;
        done
    networks: [logistitrack]

  orders:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    environment:
      <<: *app-environment
      SERVICE_NAME: orders
      INVENTORY_HEALTH_URL: http://inventory:5002/health
      WAREHOUSE_HEALTH_URL: http://warehouse:5003/health
      DELIVERY_HEALTH_URL: http://delivery:5004/health
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports: ["5001:5001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [logistitrack]

  inventory:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    environment:
      <<: *app-environment
      SERVICE_NAME: inventory
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports: ["5002:5002"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [logistitrack]

  warehouse:
    build:
      context: .
      dockerfile: services/warehouse/Dockerfile
    environment:
      <<: *app-environment
      SERVICE_NAME: warehouse
      PREPARATION_DELAY_SECONDS: ${PREPARATION_DELAY_SECONDS:-3}
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports: ["5003:5003"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [logistitrack]

  delivery:
    build:
      context: .
      dockerfile: services/delivery/Dockerfile
    environment:
      <<: *app-environment
      SERVICE_NAME: delivery
      DELIVERY_STEP_DELAY_SECONDS: ${DELIVERY_STEP_DELAY_SECONDS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports: ["5004:5004"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5004/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [logistitrack]

  frontend:
    build:
      context: ./frontend
    depends_on:
      orders:
        condition: service_healthy
    ports: ["8080:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/frontend-health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [logistitrack]

volumes:
  postgres_data:

networks:
  logistitrack:
    name: logistitrack
    driver: bridge
